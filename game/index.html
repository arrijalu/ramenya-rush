<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramen-ya Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210; font-family: system-ui, -apple-system, sans-serif; }

<canvas id="game" aria-label="Ramen-ya Rush: manage a late-night Tokyo ramen counter, cook noodles, ladle broth, assemble bowls, and serve hungry customers before patience runs out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
